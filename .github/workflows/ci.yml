name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate JSON config & schemas
        run: |
          python - <<'PY'
          import json, glob, sys
          bad = []
          for f in glob.glob("config/*.json") + glob.glob("schemas/*.json") + glob.glob("content/**/*.json", recursive=True):
              try:
                  json.load(open(f, encoding="utf-8"))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("JSON OK")
          PY

      - name: Run test suite (incl. editorial QA/diversity)
        run: PYTHONPATH=src python -m pytest -q

      - name: Editorial QA smoke (October fixture)
        run: PYTHONPATH=src python -m idiem.editorial_qa --month 2026-10
